<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Aim Trainer - Multi Language (Accuracy Fixed)</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <style>
    body { margin: 0; background: #111; color: white; text-align: center; }
    canvas { display: block; margin: 20px auto; border: 2px solid #4cafef; border-radius: 10px; }
    #hud { margin: 10px; font-size: 20px; }
    #startBtn {
      padding: 15px 30px; font-size: 20px; border-radius: 10px; cursor: pointer;
      background: #4cafef; color: white; border: none; margin-top: 20px;
    }
    select { margin-top: 10px; font-size: 18px; padding: 10px; }
  </style>
</head>
<body>
  <h1 id="gameTitle">Aim Trainer 🎯</h1>
  <div id="hud">Score: 0 | Time Left: 30.0 | Level: 1</div>

  <label id="langLabel">Language: </label>
  <select id="langSelect">
    <option value="ko">한국어</option>
    <option value="en" selected>English</option>
    <option value="ja">日本語</option>
    <option value="zh">中文</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="ru">Русский</option>
  </select>
  <br/>

  <label id="levelLabel">Level: </label>
  <select id="level">
    <option value="1" selected>1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  <br/>
  <label id="timeLabel">Time: </label>
  <select id="timeSelect">
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="30" selected>30</option>
    <option value="60">60</option>
  </select>
  <br/>
  <button id="startBtn">Start Game</button>

  <script>
    const translations = {
      ko: { title: "에임 트레이너 🎯", score: "점수", time: "남은 시간", level: "레벨", gameOver: "게임 종료!", accuracy: "정확도", restart: "다시 시작", lang: "언어", timeSelect: "시간" },
      en: { title: "Aim Trainer 🎯", score: "Score", time: "Time Left", level: "Level", gameOver: "Game Over!", accuracy: "Accuracy", restart: "Restart", lang: "Language", timeSelect: "Time" },
      ja: { title: "エイムトレーナー 🎯", score: "スコア", time: "残り時間", level: "レベル", gameOver: "ゲーム終了!", accuracy: "正確度", restart: "再スタート", lang: "言語", timeSelect: "時間" },
      zh: { title: "瞄准训练 🎯", score: "分数", time: "剩余时间", level: "等级", gameOver: "游戏结束!", accuracy: "准确率", restart: "重新开始", lang: "语言", timeSelect: "时间" },
      es: { title: "Entrenador de Puntería 🎯", score: "Puntuación", time: "Tiempo Restante", level: "Nivel", gameOver: "¡Juego Terminado!", accuracy: "Precisión", restart: "Reiniciar", lang: "Idioma", timeSelect: "Tiempo" },
      fr: { title: "Entraîneur de Viser 🎯", score: "Score", time: "Temps Restant", level: "Niveau", gameOver: "Jeu Terminé!", accuracy: "Précision", restart: "Recommencer", lang: "Langue", timeSelect: "Temps" },
      de: { title: "Zieltrainer 🎯", score: "Punkte", time: "Verbleibende Zeit", level: "Stufe", gameOver: "Spiel Vorbei!", accuracy: "Genauigkeit", restart: "Neu Starten", lang: "Sprache", timeSelect: "Zeit" },
      ru: { title: "Тренажёр Аима 🎯", score: "Очки", time: "Оставшееся Время", level: "Уровень", gameOver: "Игра Окончена!", accuracy: "Точность", restart: "Начать заново", lang: "Язык", timeSelect: "Время" }
    };

    let score = 0;
    let timeLeft = 30.0;
    let hits = 0, totalClicks = 0;
    let game, gameScene;
    let targets = [];
    let currentLevel = 1;
    let totalTime = 30;
    let currentLang = "en";

    const levelSizes = { 1: 30, 2: 25, 3: 20, 4: 15, 5: 10 };

    function updateHUD() {
      document.getElementById("hud").innerText =
        `${translations[currentLang].score}: ${score} | ${translations[currentLang].time}: ${timeLeft.toFixed(1)} | ${translations[currentLang].level}: ${currentLevel}`;
      document.getElementById("gameTitle").innerText = translations[currentLang].title;
      document.getElementById("langLabel").innerText = translations[currentLang].lang + ": ";
      document.getElementById("levelLabel").innerText = translations[currentLang].level + ": ";
      document.getElementById("timeLabel").innerText = translations[currentLang].timeSelect + ": ";
      document.getElementById("startBtn").innerText = translations[currentLang].restart;
    }

    document.getElementById("langSelect").onchange = (e) => {
      currentLang = e.target.value;
      updateHUD();
    };

    gameScene = new Phaser.Scene('Game');

    gameScene.create = function() {
      score = 0;
      timeLeft = totalTime;
      hits = 0;
      totalClicks = 0;
      targets = [];
      updateHUD();

      // 전체 화면 클릭 → totalClicks 증가
      this.input.on('pointerdown', () => {
        totalClicks++;
      });

      this.timer = this.time.addEvent({
        delay: 100,
        loop: true,
        callback: () => {
          timeLeft -= 0.1;
          updateHUD();
          if (timeLeft <= 0) {
            this.endGame();
          }
        }
      });

      this.spawnTargets();
    };

    gameScene.spawnTargets = function() {
      targets.forEach(t => t.destroy());
      targets = [];

      let size = levelSizes[currentLevel];
      for (let i = 0; i < 10; i++) {
        let x = Phaser.Math.Between(50, 750);
        let y = Phaser.Math.Between(50, 550);
        let circle = this.add.circle(x, y, size, 0xff4444).setInteractive();
        circle.on('pointerdown', () => {
          hits++;
          score++;
          circle.destroy();
          targets = targets.filter(t => t !== circle);
          updateHUD();
          if (targets.length === 0) {
            this.spawnTargets();
          }
        });
        targets.push(circle);
      }
    };

    gameScene.endGame = function() {
      targets.forEach(t => t.destroy());
      this.scene.pause();
      document.getElementById("level").disabled = false;
      document.getElementById("timeSelect").disabled = false;

      let accuracy = totalClicks > 0 ? ((hits / totalClicks) * 100).toFixed(1) : 0;
      alert(`${translations[currentLang].gameOver}\n${translations[currentLang].score}: ${score}\n${translations[currentLang].accuracy}: ${accuracy}%`);
      location.reload();
    };

    let config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      backgroundColor: "#222",
      scene: [gameScene]
    };

    document.getElementById("startBtn").onclick = function() {
      this.style.display = "none";
      currentLevel = parseInt(document.getElementById("level").value);
      totalTime = parseInt(document.getElementById("timeSelect").value);
      document.getElementById("level").disabled = true;
      document.getElementById("timeSelect").disabled = true;
      game = new Phaser.Game(config);
    };
  </script>
</body>
</html>
